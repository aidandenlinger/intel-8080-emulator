name: Check
on: push

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Required for checkout while this repo is private
      contents: read
   
    steps:
      - name: Checkout repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # We will not perform any other git operations in this repo
          persist-credentials: false

      - name: Configure rust stable
        run: rustup update stable --no-self-update && rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: Install Just
        uses: taiki-e/install-action@3839ec485e8ef50e4a86e9cd116260b68a412c07 # v2.58.10
        with:
          tool: just@1

      - run: just ci
